- aid: rabobank-australia:rabobank-australia-cdr-product-reference-data-api
  name: Rabobank Australia CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Products
  - Public API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.rabobank.com.au/support/open-banking
  baseURL: https://openbanking.api.rabobank.com.au/public/cds-au/v1/banking/products
  properties:
  - url: https://www.rabobank.com.au/support/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  - url: openapi/rabobank-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: 'PUBLIC / unauthenticated Consumer Data Right Product Reference Data
    (PRD) surface covering GET /banking/products (list) and GET /banking/products/{productId}
    (detail: rates, fees, features, eligibility, constraints) for Rabobank Australia''s
    openly available banking products (online savings, transaction accounts, term
    deposits including SMSF). Confirmed live at GET /banking/products (HTTP 200, x-v
    4, 34 products, 2026-07-21). Conforms to the DSB Consumer Data Standards Banking
    API (cds_banking v1.36.0); no accreditation or consumer consent required.'
- aid: rabobank-australia:rabobank-australia-cdr-accounts-balances-api
  name: Rabobank Australia CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Banking
  - Accounts
  - Balances
  - Consumer Authorized
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.rabobank.com.au/support/open-banking
  baseURL: https://openbanking.api.rabobank.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.rabobank.com.au/support/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-accounts
    type: APIReference
  - url: openapi/rabobank-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: 'CONSUMER-AUTHORIZED Consumer Data Right banking surface: Get Accounts
    (GET /banking/accounts), Get Bulk Balances (POST/GET /banking/accounts/balances),
    Get Account Balance (GET /banking/accounts/{accountId}/balance) and Get Account
    Detail (GET /banking/accounts/{accountId}). Not public — requires an accredited
    data recipient (ADR) and explicit consumer consent, reached via the bank''s MTLS
    resource endpoint (OAuth2/OIDC FAPI) discovered through the CDR Register. Conforms
    to the DSB Consumer Data Standards Banking API (cds_banking v1.36.0).'
