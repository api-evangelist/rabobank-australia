    (GET /banking/payees, the consumer''s saved payee list) and Get Payee Detail (GET
    /banking/payees/{payeeId}, including domestic/international/biller payload). Not
    public — requires an accredited data recipient (ADR) and explicit consumer consent
    over the bank''s MTLS resource endpoint (OAuth2/OIDC FAPI). Conforms to the DSB
    Consumer Data Standards Banking API (cds_banking v1.36.0).'
