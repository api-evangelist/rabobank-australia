    type: OpenAPI
  description: 'CONSUMER-AUTHORIZED Consumer Data Right surface for recurring debits
    and scheduled payments: Get Direct Debits For Account and Get Bulk Direct Debits
    (/banking/accounts/{accountId}/direct-debits and /banking/accounts/direct-debits),
    plus Get Scheduled Payments For Account and Get Bulk Scheduled Payments (/banking/accounts/{accountId}/payments/scheduled
    and /banking/payments/scheduled). Not public — requires an accredited data recipient
    (ADR) and explicit consumer consent over the bank''s MTLS resource endpoint (OAuth2/OIDC
    FAPI). Conforms to the DSB Consumer Data Standards Banking API (cds_banking v1.36.0).'
