  - url: openapi/rabobank-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right Product Reference Data (PRD)
    API listing Rabobank Australia's openly available banking products (transaction
    and savings accounts, term deposits including SMSF). Confirmed live at GET /banking/products
    (HTTP 200, x-v 4, 34 products) conforming to the DSB Consumer Data Standards Banking
    API.
