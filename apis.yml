name: Rabobank Australia
kind: company
description: Rabobank Australia is the Australian arm of Rabobank Group, the Netherlands-headquartered
  cooperative bank and one of the world's leading food and agribusiness specialist
  lenders. In Australia it operates as an Authorised Deposit-taking Institution (ADI),
  offering rural and agribusiness finance alongside consumer online savings accounts
  and term deposits, including SMSF products. As a member-focused, cooperatively owned
  institution rather than a shareholder-driven bank, its Australian retail and business
  deposit products fall under the Consumer Data Right (CDR / Open Banking). Rabobank
  therefore exposes a public, unauthenticated Product Reference Data (PRD) API that
  conforms to the Data Standards Body (DSB) Consumer Data Standards, while authenticated
  consumer data sharing follows the CDR accredited data recipient (ADR) model built
  on OAuth2 / OpenID Connect (FAPI).
