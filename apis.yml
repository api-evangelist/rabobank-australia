  - Transactions
  - Consumer Authorized
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.rabobank.com.au/support/open-banking
  baseURL: https://openbanking.api.rabobank.com.au/cds-au/v1/banking/accounts/{accountId}/transactions
  properties:
  - url: https://www.rabobank.com.au/support/open-banking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-transactions-for-account
    type: APIReference
  - url: openapi/rabobank-australia-cds-banking-products-openapi.yml
    type: OpenAPI
  description: 'CONSUMER-AUTHORIZED Consumer Data Right transactions surface: Get Transactions
    For Account (GET /banking/accounts/{accountId}/transactions, with date/amount/text
    filtering) and Get Transaction Detail (GET /banking/accounts/{accountId}/transactions/{transactionId}).
    Not public — requires an accredited data recipient (ADR) and explicit consumer
    consent over the bank''s MTLS resource endpoint (OAuth2/OIDC FAPI). Conforms to
    the DSB Consumer Data Standards Banking API (cds_banking v1.36.0).'
